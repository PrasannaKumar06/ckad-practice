apiVersion: batch/v1
kind: Job
metadata:
  name: math-add-job
spec:
  completions: 3
  parallelism: 3
  template:
    spec:
      containers:
      - name: math-add
        image: ubuntu
        command: ["expr","3","+","5"]
      restartPolicy: Never
  backoffLimit: 4  

# kubectl create job math-add-job --image=ubuntu -- expr 3 + 5
# kubectl patch job math-add-job -p '{"spec":{"completions":3,"parallelism":3,"backoffLimit":4}}'

# kubectl create cronjob math-add-cronjob \
#   --image=ubuntu \
#   --schedule="*/1 * * * *" \
#   -- expr 3 + 5

